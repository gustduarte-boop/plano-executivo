name: Supabase Keep-Alive

on:
  schedule:
    - cron: '0 8 * * *'  # Daily 08:00 UTC = 05:00 BRT
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Ping Supabase
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" \
            "https://frdvafcdxxaptfiiveeu.supabase.co/rest/v1/saldos?select=count" \
            -H "apikey: ${{ secrets.SUPABASE_ANON_KEY }}" \
            -H "Prefer: count=exact")
          echo "Supabase status: $STATUS"
          [ "$STATUS" = "200" ] || exit 1
